<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>warning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  html { overflow-x: hidden; }
  body { background: #f6f6f7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 600; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; color: #111; display: flex; flex-direction: column; }
  header { background: #fff; height: 53px; padding: 0 24px; display: flex; align-items: center; border-bottom: 1px solid #ececec; flex: none; }
  .logo { font-size: 21px; font-weight: 800; color: #000; letter-spacing: -0.6px; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 8vw 24px; }
  .hidden { display: none !important; }

  /* ================= MÀN HÌNH XEM MEDIA ================= */
  .frame { width: 100%; max-width: 900px; text-align: center; position: relative; z-index: 1; }
  #viewer { position: relative; overflow-x: clip; }
  .imgbox { position: relative; z-index: 1; display: inline-block; max-width: 100%; border-radius: 5px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.08); line-height: 0; }
  #pic { object-fit: contain; opacity: 0; filter: blur(24px); transform: scale(1.04); transition: opacity .5s ease, filter 1.6s ease, transform 1.6s ease; display: block; max-width: 100%; max-height: none; width: auto; height: auto; pointer-events: none; }
  #pic.shown { opacity: 1; }
  #pic.loaded { filter: blur(0); transform: scale(1); }
  .imgbox { transition: box-shadow .6s ease; }
  .tv-card { display: inline-block; position: relative; max-width: 100%; line-height: 0; }
  .imgbox { background: transparent; }   /* không nền đen: tránh viền đen quanh ảnh lúc chờ vầng sáng */
  .imgbox.live { width: var(--mw, auto); }
  .imgbox.live #pic { width: 100%; height: var(--mh, auto); max-height: none; object-fit: cover; background: transparent; }
  .imgbox.live { background: transparent; }   /* khung đã đúng tỉ lệ: cover + nền trong suốt để không lòi viền đen do làm tròn pixel */
  @property --h { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .imgbox { animation: hue 3s linear infinite; }
  .imgbox.ready { animation: none; }
  .imgbox::before { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity .9s ease; background: linear-gradient(90deg, #ff2d55, #ff9500, #ffd60a, #30d158, #00c7ff, #5e5ce6, #bf5af2, #ff2d55); background-size: 200% 100%; animation: slide 1.4s linear infinite; }
  .imgbox.loading::before { opacity: 1; }
  .imgbox.loading { width: 220px; height: 4px; border-radius: 4px; box-shadow: 0 0 14px 2px rgba(0,160,255,.6); box-shadow: 0 0 14px 2px hsl(var(--h) 100% 55% / .65); }
  .imgbox::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; border: 1px solid #000; border-radius: inherit; }
  .imgbox.loading::after { display: none; }   /* thanh chờ 4px: không viền */
  @keyframes hue { to { --h: 360deg; } }
  @keyframes slide { to { background-position: -200% 0; } }
  .imgbox.sizing { transition: width .45s cubic-bezier(.4,0,.2,1), height .95s cubic-bezier(.22,.8,.25,1), box-shadow .6s ease; }
  .caption { transition: opacity .7s ease; }
  /* Khung kéo xuống: ảnh dài bị che còn 70% màn hình, bấm ↓ (hoặc kéo) để mở hết */
  .imgbox.pulling { transition: height .7s cubic-bezier(.22,.8,.25,1), box-shadow .6s ease; }
  .imgbox.dragging { transition: none !important; }
  .pullbar { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 96px; z-index: 6; align-items: flex-end; justify-content: center; padding-bottom: 14px; border-radius: 0 0 5px 5px; pointer-events: none; }
  .pullbar::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0)); transition: opacity .5s ease; }
  .tv-card.pullable .pullbar { display: flex; }
  .tv-card.expanded .pullbar::before { opacity: 0; }
  .pullbtn { position: relative; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.94); color: #111; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; touch-action: none; box-shadow: 0 2px 12px rgba(0,0,0,.28); transition: transform .2s ease; }
  .pullbtn:active { transform: scale(.9); }
  .pullbtn svg { width: 20px; height: 20px; display: block; transition: transform .5s cubic-bezier(.22,.8,.25,1); }
  .tv-card.expanded .pullbtn svg { transform: rotate(180deg); }
  /* Các nút tương tác trượt từ dưới lên khi ảnh tải xong */
  @keyframes riseUp { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
  .tv-card:not(.done) .soc a, .tv-card:not(.done) .react, .tv-card:not(.done) .pullbtn { opacity: 0; transform: translateY(48px); }
  .tv-card.done .soc a, .tv-card.done .react, .tv-card.done .pullbtn { animation: riseUp .65s cubic-bezier(.22,1,.36,1) backwards; }
  .tv-card.done .soc a:nth-child(1) { animation-delay: .05s; }
  .tv-card.done .soc a:nth-child(2) { animation-delay: .12s; }
  .tv-card.done .react { animation-delay: .2s; }
  .tv-card.done .pullbtn { animation-delay: .3s; }
  body:not(.ui-done) .foot .gh { opacity: 0; transform: translateY(48px); pointer-events: none; }
  body.ui-done .foot .gh { animation: riseUp .65s .35s cubic-bezier(.22,1,.36,1) backwards; }
  @media (prefers-reduced-motion: reduce) { .tv-card.done .soc a, .tv-card.done .react, .tv-card.done .pullbtn, body.ui-done .foot .gh { animation: none; } }
  /* Che mờ kiểu Telegram: ảnh mờ + hạt lấp lánh, chạm vào mới hiện */
  .imgbox.spoiler #pic { filter: blur(6px) !important; transform: scale(1.04) !important; }
  .imgbox.unveil #pic { transition: opacity .5s ease, filter .5s ease, transform .5s ease !important; }
  .spoil { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; cursor: pointer; opacity: 0; background: transparent; transition: opacity .5s ease; }
  .spoil.on { opacity: 1; }
  .shield { position: absolute; inset: 0; background: transparent; z-index: 2; }
  /* Hàng dưới ảnh: [2 nút MXH] — kaiis — [viên thuốc cảm xúc] */
  .row { position: absolute; left: 50%; transform: translateX(-50%); width: max(100%, 290px); top: 100%; margin-top: 12px; z-index: 6; display: block; line-height: 1; transition: opacity .7s ease; }
  .rowtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tv-card.hasmeta { margin-bottom: 48px; }
  .meta { margin-top: 10px; text-align: left; display: flex; flex-direction: column; gap: 5px; }
  .meta .mt { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .md { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #8a8a8f; line-height: 1.2; }
  .meta .md svg { flex: none; width: 13px; height: 13px; display: block; }
  .foot { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 6px 24px calc(24px + env(safe-area-inset-bottom)); text-align: right; }
  .foot .mail { font-size: 12px; font-weight: 600; color: #8a8a8f; letter-spacing: -0.1px; text-decoration: none; }
  .foot .gh { position: relative; margin-top: 14px; width: auto; padding: 0 22px; gap: 10px; height: 42px; border-radius: 10px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: -0.2px; box-shadow: 0 2px 10px rgba(0,0,0,.14); transition: transform .2s ease; }
  .foot .gh:active { transform: scale(.97); }
  .foot .gh svg { flex: none; width: 21px; height: 21px; display: block; }
  .tv-card:not(.done) .row { opacity: 0; pointer-events: none; }
  .react { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.14); line-height: 1; }
  .react button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; font-size: 17px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; transition: transform .14s cubic-bezier(.3,1.6,.5,1), background .12s ease; }
  @media (hover: hover) { .react button:hover { transform: scale(1.18); } }
  .react button:active { transform: scale(.88); transition-duration: .05s; }
  .react button.on { background: rgba(0,0,0,.07); transform: scale(1.12); }
  .float-emo { position: absolute; bottom: 4px; z-index: 7; font-size: 20px; line-height: 1; pointer-events: none; animation: floatUp 1s ease-out both; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 6% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 0), -90px) scale(1.25); } }
  .caption { font-size: 12px; font-weight: 600; color: #8a8a8f; letter-spacing: -0.1px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  /* 2 nút mạng xã hội tròn (không viên thuốc) */
  .soc { display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 8px; }
  .soc a { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 2px 10px rgba(0,0,0,.16); transition: transform .2s ease; }
  .soc a:active { transform: scale(.92); }
  .soc svg { width: 18px; height: 18px; display: block; }
  .soc .th { background: #000; color: #fff; }
  .soc .ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: #111; color: #fff; padding: 10px 18px; border-radius: 3px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-color-scheme: dark) {
    body { background: #0e0e10; color: #f2f2f3; }
    header { background: #161618; border-bottom-color: #26262a; }
    .logo { color: #fff; }
    .caption, .foot .mail, .meta .md { color: #9a9aa2; }
    .foot .gh { box-shadow: 0 0 0 1px #2e2e33; }
    .imgbox { box-shadow: 0 4px 18px rgba(0,0,0,.5); }
    .imgbox::after { border-color: #fff; }
    .react { background: #26262a; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    .react button.on { background: rgba(255,255,255,.12); }
    .soc .th { background: #fff; color: #000; }
    .pullbtn { background: rgba(38,38,42,.94); color: #fff; }
  }
  /* ===== Nút i + ô nhập kiểu kính lỏng ===== */
  .tv-card.infoOpen #pic { filter: blur(18px) brightness(.8) !important; transform: scale(1.1) !important; transition: filter .5s ease, transform .5s ease !important; }
  .pullbar { transition: opacity .3s ease; }
  .tv-card.infoOpen .pullbar { opacity: 0; }
  .tv-card.infoOpen .pullbtn { pointer-events: none; }
  .infoov { position: absolute; inset: 0; z-index: 8; border-radius: 5px; overflow: hidden; display: flex; align-items: center; justify-content: center; line-height: 1.2; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s; }
  .tv-card.infoOpen .infoov { opacity: 1; visibility: visible; transition: opacity .35s ease; }
  .glass { position: relative; flex: none; width: min(340px, calc(100% - 28px)); display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 20px; border-radius: 999px;
    background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,.42);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(255,255,255,.14), 0 10px 32px rgba(0,0,0,.3);
    transform: translateY(12px) scale(.96); transition: transform .5s cubic-bezier(.22,1,.36,1); }
  .tv-card.infoOpen .glass { transform: none; }
  .glass.shake { animation: shake .35s ease; }
  @keyframes shake { 0%,100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; } }
  .glass input { flex: 1; min-width: 0; height: 40px; border: 0; outline: 0; background: transparent; color: #fff; font: 600 16px/1.2 -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.2px; text-shadow: 0 1px 6px rgba(0,0,0,.25); -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none; }
  .glass input::placeholder { color: rgba(255,255,255,.75); }
  .glass .go { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.3); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.5); transition: transform .15s ease, background .15s ease; }
  .glass .go:active { transform: scale(.9); background: rgba(255,255,255,.45); }
  .glass .go svg { width: 18px; height: 18px; display: block; }
  /* ===== X (Twitter) + video: khung đa phương tiện ===== */
  .xstage { position: absolute; left: 0; top: 0; z-index: 0; overflow: hidden; transition: height .7s cubic-bezier(.22,.8,.25,1); }
  .xm { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; object-fit: contain; background: transparent; opacity: 0; filter: blur(24px); transform: scale(1.04); transition: opacity .5s ease, filter 1.6s ease, transform 1.6s ease; }
  video.xm { background: #000; }
  .xm.shown { opacity: 1; }
  .xm.loaded { filter: none; transform: none; }
  .xm.nav { filter: none; transform: none; transition: opacity .3s ease; }
  .xnav { position: absolute; top: 50%; margin-top: -18px; z-index: 4; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font: 700 18px/1 -apple-system, BlinkMacSystemFont, "Inter", Arial, sans-serif; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: opacity .25s ease, transform .15s ease; }
  .xnav.prev { left: 8px; }
  .xnav.next { right: 8px; }
  .xnav:active { transform: scale(.9); }
  .xnav:disabled { opacity: 0; pointer-events: none; }
  .xcount { position: absolute; top: 8px; right: 8px; z-index: 4; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; font-weight: 700; line-height: 1.3; pointer-events: none; }
  .tv-card:not(.done) .xnav, .tv-card:not(.done) .xcount { opacity: 0; pointer-events: none; }
  .xtext { width: 0; min-width: 100%; margin-top: 10px; text-align: left; font-size: 14px; font-weight: 500; line-height: 1.45; color: #111; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; cursor: pointer; }
  .xtext.open { display: block; -webkit-line-clamp: unset; }
  .tv-card:not(.done) .xtext { opacity: 0; }
  .tv-card.done .xtext { animation: riseUp .65s .1s cubic-bezier(.22,1,.36,1) backwards; }
  .xtc { box-sizing: border-box; width: 100%; max-height: 100%; overflow-y: auto; padding: 16px; text-align: left; line-height: 1.45; background: #fff; color: #111; }
  .xtc .xa { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .xtc .xa img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
  .xtc .xn { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .xtc .xh { font-size: 13px; font-weight: 500; color: #8a8a8f; }
  .xtc .xt { font-size: 16px; font-weight: 500; white-space: pre-wrap; word-break: break-word; }
  @media (prefers-color-scheme: dark) {
    .xtext { color: #f2f2f3; }
    .xtc { background: #1a1a1d; color: #f2f2f3; }
  }
  @media (prefers-reduced-motion: reduce) { .tv-card.done .xtext { animation: none; } }
  @media print { body { display: none !important; } }
</style>
</head>

        var p = P[i];
        p.x += p.vx; p.y += p.vy; p.a += p.da;
        if (p.a >= 1) { p.a = 1; p.da = -p.da; }
        else if (p.a <= 0) { p.a = 0; p.da = Math.abs(p.da); p.x = Math.random() * w; p.y = Math.random() * h; }
        ctx.globalAlpha = p.a * .6; ctx.fillRect(p.x, p.y, p.r, p.r);
      }
    })(0);
    c.addEventListener('click', function () { unveil(c); });
    setTimeout(function () { c.classList.add('on'); }, 50);
  }

  function start() {
    var pic, my = ++gen, revealed = false, tmo;
    var failed = function () { if (my !== gen) return; clearTimeout(tmo); notFound(); };
    var isGif = GIF_RE.test(MEDIA_URL);
    if (isGif) {
      pic = document.createElement('canvas');
      pic.id = 'pic';
      box0.insertBefore(pic, shield);
    } else {
      pic = document.createElement('img');
      pic.id = 'pic'; pic.alt = ''; pic.draggable = false; pic.src = MEDIA_URL;
      box0.insertBefore(pic, shield);
    }

    function finish() {
      if (my !== gen) return;
      box0.classList.remove('loading', 'sizing');
      box0.classList.add('live');
      ambientStart(function () { return pic; }, isGif);
      box0.style.width = '';                      // chiều cao khung giữ nguyên (đang điều khiển bởi nút ↓)
      pic.style.width = pic.style.height = '';
      if (isGif && pic.tagName === 'CANVAS') {
        var real = new Image(), old = pic;
        real.alt = ''; real.draggable = false; real.className = old.className;
        real.onload = function () {
          (real.decode ? real.decode() : Promise.resolve()).then(function () {
            real.id = 'pic'; old.removeAttribute('id');
            if (old.parentNode) { box0.insertBefore(real, old); box0.removeChild(old); pic = real; }
          }, function () {});
        };
        real.src = MEDIA_URL;
      }
    }
    function reveal() {
      if (revealed || my !== gen) return; revealed = true; clearTimeout(tmo);
      var nw = pic.naturalWidth, nh = pic.naturalHeight;
      if (!nw || !nh) { pic.classList.add('shown', 'loaded'); box0.classList.add('ready'); box0.parentNode.classList.add('on', 'done'); return finish(); }
      var fw = box0.closest('.frame').clientWidth || window.innerWidth;
      var w = Math.min(fw, 460);
      var full = Math.round(w * nh / nw);                           // chiều cao ảnh đầy đủ, đúng tỉ lệ gốc
      var colH = Math.max(160, Math.round(window.innerHeight * 0.7 - 53 - 12));   // khung phủ tới 7/10 màn hình (trừ header + lề trên)
      var can = full > colH + 24;                                   // ảnh dài hơn 70% -> có nút ↓ để kéo xuống
      var h = can ? colH : full;
      P = { w: w, col: h, full: full, exp: false, can: can };
      box0.style.setProperty('--mw', w + 'px'); box0.style.setProperty('--mh', full + 'px');
      pic.style.width = w + 'px'; pic.style.height = full + 'px';
      box0.classList.add('spoiler'); box0.parentNode.classList.add('spoiled'); makeSpoiler(w, h, my);
      ambientStart(function () { return pic; }, false, w, h);   // bật vầng sáng ngay lập tức
      updateDoodle(h);                                          // ảnh ngắn -> nền icon dài hơn
      box0.style.width = '220px'; box0.style.height = '4px';
      box0.classList.add('sizing');
      void box0.offsetWidth;
      box0.style.width = w + 'px';
      setTimeout(function () {
        if (my !== gen) return;
        box0.classList.remove('loading');
        box0.parentNode.classList.add('on');
        pic.classList.add('shown');
        box0.style.height = h + 'px';
        setTimeout(function () {
          if (my !== gen) return;
          box0.classList.add('ready'); snapBox();
          box0.parentNode.classList.add('done');
          if (P.can) box0.parentNode.classList.add('pullable');
          pic.classList.add('loaded');
          setTimeout(finish, 1700);
        }, 950);
      }, 450);
    }
    if (isGif) {
      var ld = new Image();
      ld.onload = function () {
        pic.width = ld.naturalWidth; pic.height = ld.naturalHeight;
        pic.getContext('2d').drawImage(ld, 0, 0);
        pic.naturalWidth = ld.naturalWidth; pic.naturalHeight = ld.naturalHeight;
        reveal();
      };
      ld.onerror = failed;
      ld.src = MEDIA_URL;
    } else {
      var done = function () { if (pic.decode) pic.decode().then(reveal, reveal); else reveal(); };
      if (pic.complete && pic.naturalWidth) done();
      else { pic.addEventListener('load', done); pic.addEventListener('error', failed); }
    }
    tmo = setTimeout(function () { if (!revealed) failed(); }, 20000);
  }

  // ---- Nút ↓ : kéo khung xuống để thấy hết ảnh (bấm hoặc vuốt xuống), bấm lại để thu lên ----
  var pullBtn = $('pullBtn'), sy = 0, pressing = false, moved = false;
  function setExp(v) {
    P.exp = v;
    card.classList.toggle('expanded', v);
    pullBtn.setAttribute('aria-label', v ? 'Kéo lên' : 'Kéo xuống');
    box0.classList.add('pulling');
    box0.style.height = (v ? P.full : P.col) + 'px';
  }
  pullBtn.addEventListener('pointerdown', function (e) {
    if (e.button > 0 || !P.can) return;
    pressing = true; moved = false; sy = e.clientY;
    try { pullBtn.setPointerCapture(e.pointerId); } catch (x) {}
  });
  pullBtn.addEventListener('pointermove', function (e) {
    if (!pressing) return;
    var dy = e.clientY - sy;
    if (Math.abs(dy) < 6 && !moved) return;
    moved = true;
    box0.classList.remove('pulling'); box0.classList.add('dragging');
    var base = P.exp ? P.full : P.col;
    box0.style.height = Math.max(P.col, Math.min(P.full, base + dy)) + 'px';
  });
  function release() {
    if (!pressing) return; pressing = false;
    box0.classList.remove('dragging');
    if (moved) setExp(box0.getBoundingClientRect().height > (P.col + P.full) / 2);
    else setExp(!P.exp);
  }
  pullBtn.addEventListener('pointerup', release);
  pullBtn.addEventListener('pointercancel', release);
  pullBtn.addEventListener('click', function (e) { if (e.detail === 0 && P.can) setExp(!P.exp); });   // bàn phím

  function notFound(msg) {
    box0.style.transition = 'opacity .35s ease';
    box0.style.opacity = '0';
    setTimeout(function () {
      showToast(typeof msg === 'string' ? msg : 'Không tìm thấy ảnh');
      if (MEDIA_URL !== DEFAULT_IMG) load(DEFAULT_IMG);   // sai mã -> hiện ảnh mặc định
      else document.body.classList.add('ui-done');        // ảnh mặc định cũng lỗi -> vẫn hiện nút chân trang
    }, 400);
  }

  // ---- Nhận mã / link rồi tải media ----
  // Chấp nhận: "m2VD" | "https://byvn.net/m2VD" | link ảnh/GIF đầy đủ | "thư-mục/tên.đuôi" (supaimg)
  function load(raw) {
    raw = (raw || '').trim();
    if (!raw) return;
    resetViewer();

    // Bài đăng X: x.com/<user>/status/<id> | twitter.com/... | <user>/status/<id>
    var xp = parseX(raw);
    if (xp) return loadX(xp.user, xp.id);
    // Video trực tiếp: link .mp4 / .webm / .mov / .m4v / .ogv
    if (isVideoUrl(raw)) { MEDIA_URL = ''; return startMedia([{ type: 'video', url: raw, thumb: '', w: 0, h: 0 }], null); }

    // ImgBB: ibb.co/<id> | ibb/<id> -> trang ảnh; i.ibb.co/<id>/<file> -> link ảnh trực tiếp
    var mp = raw.match(/^(?:https?:\/\/)?(?:www\.)?ibb\.co\/([A-Za-z0-9]+)/i) || raw.match(/^ibb\/([A-Za-z0-9]+)$/i);
    if (mp) return loadIbbPage(mp[1]);
    var md = raw.match(/^(?:https?:\/\/)?i\.ibb\.co\/([A-Za-z0-9]+)\//i);
    if (md) {
      MEDIA_URL = /^https?:/i.test(raw) ? raw : 'https://' + raw;
      if (raw !== DEFAULT_IMG) loadIbbMeta(md[1]);
      else { setCaption({ title: DEFAULT_TITLE }); loadIbbMeta(DEFAULT_PAGE); }   // ảnh mặc định cũng có tiêu đề/ngày
      return start();
    }

    // Link đầy đủ
    if (/^https?:\/\//i.test(raw)) {
      var u;
      try { u = new URL(raw); } catch (e) { return notFound(); }
      var last = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || '');
      if (/(^|\.)byvn\.net$/i.test(u.hostname) && /^[A-Za-z0-9_-]+$/.test(last)) {
        return load(last);
      }
      MEDIA_URL = raw;
            return start();
    }
    raw = raw.replace(/^\/+|\/+$/g, '');

    // Dạng 'thư-mục/tên-file.đuôi' -> supaimg
    if (/^[A-Za-z0-9-]+\/[A-Za-z0-9_-]+\.[A-Za-z0-9]+$/.test(raw)) {
      MEDIA_URL = 'https://i.supaimg.com/' + raw;
            return start();
    }

    if (!/^[A-Za-z0-9_-]+$/.test(raw) || /^index(\.html)?$/i.test(raw)) return notFound();

    // Chỉ có mã -> https://byvn.net/<mã>
    MEDIA_URL = CDN + raw;
    start();
  }

  // ---- Link vẫn dùng được: ?src= , ?id= , /thư-mục/tên.đuôi , /mã. Không có mã -> ảnh mặc định ----
  (function initial() {
    var qs = new URLSearchParams(location.search);
    var src = qs.get('src'), id = qs.get('id');
    if (src) return load(src);
    if (id) {   // ?id=8D6b7NPg -> mã trang ImgBB (ibb.co/8D6b7NPg); mã có - hoặc _ vẫn theo kiểu cũ
      if (/^[A-Za-z0-9]+$/.test(id.trim())) { resetViewer(); return loadIbbPage(id.trim()); }
      return load(id);
    }
    if (location.protocol !== 'file:') {
      var parts = decodeURIComponent(location.pathname).split('/').filter(Boolean);
      // GitHub Pages dạng user.github.io/<tên-repo>/ : bỏ tên repo, nó không phải mã ảnh
      if (/\.github\.io$/i.test(location.hostname)) parts.shift();
      var path = parts.join('/');
      if (path && !/^index(\.html)?$/i.test(path)) return load(path);
    }
    load(DEFAULT_IMG);
  })();

  // ---- Toast ----
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove('show'); }, 2000);
  }

  // ---- Nút i: nhập mã ảnh (?id=xxxx) hoặc link ImgBB ----
  var infoOv = $('infoOv'), infoGlass = $('infoGlass'), infoIn = $('infoIn'), infoGo = $('infoGo');
  function openInfo() {
    card.classList.add('infoOpen');
    try { infoIn.focus({ preventScroll: true }); } catch (e) { infoIn.focus(); }
  }
  function closeInfo() {
    card.classList.remove('infoOpen');
    infoIn.blur();
  }
  function submitInfo() {
    var raw = infoIn.value.trim();
    if (!raw) { infoGlass.classList.remove('shake'); void infoGlass.offsetWidth; infoGlass.classList.add('shake'); return; }
    if (parseX(raw) || isVideoUrl(raw)) { closeInfo(); infoIn.value = ''; return load(raw); }                  // link X / video
    var id = null, src = null, t = raw.replace(/^\?/, '');
    if (/^(id|src)=/i.test(t)) { var p = new URLSearchParams(t); id = p.get('id'); src = p.get('src'); }      // ?id=xxxx | id=xxxx | ?src=...
    else if (/^https?:\/\//i.test(raw)) {                                                                    // link trang web có ?id= / ?src=
      try { var u = new URL(raw); if (!/(^|\.)ibb\.co$/i.test(u.hostname)) { id = u.searchParams.get('id'); src = u.searchParams.get('src'); } } catch (e) {}
    } else if (/^[A-Za-z0-9]+$/.test(raw)) id = raw;                                                           // chỉ gõ mã -> như ?id=
    closeInfo(); infoIn.value = '';
    if (src) return load(src);
    if (id) { id = id.trim(); if (/^[A-Za-z0-9]+$/.test(id)) { resetViewer(); return loadIbbPage(id); } return load(id); }
    load(raw);                                                                                                  // link ImgBB / ảnh trực tiếp
  }
  document.addEventListener('kaiis:info', function () { card.classList.contains('infoOpen') ? closeInfo() : openInfo(); });   // giữ 🫪 3 giây
  infoOv.addEventListener('click', function (e) { if (e.target === infoOv) closeInfo(); });
  infoGo.addEventListener('click', submitInfo);
  infoIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitInfo(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && card.classList.contains('infoOpen')) closeInfo(); });
  // ←/→ trên bàn phím: chuyển ảnh/video trong bài X (không can thiệp khi đang gõ hoặc đang tua video)
  document.addEventListener('keydown', function (e) {
    if (!xNav || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'VIDEO' || card.classList.contains('infoOpen')) return;
    xNav(e.key === 'ArrowLeft' ? -1 : 1);
  });

  // ---- Chống sao chép ảnh ----
  var isField = function (e) { return e.target && e.target.tagName === 'INPUT'; };
  var block = function (e) { if (isField(e)) return; e.preventDefault(); return false; };
  ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(function (ev) {
    document.addEventListener(ev, block);
  });
  document.addEventListener('keydown', function (e) {
    if (isField(e)) return;
    var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
    if (e.key === 'F12' || e.key === 'PrintScreen' ||
        (c && ['s', 'u', 'p', 'c', 'a'].indexOf(k) > -1) ||
        (c && e.shiftKey && ['i', 'j', 'c', 's'].indexOf(k) > -1)) {
      e.preventDefault();
      if (e.key === 'PrintScreen' && navigator.clipboard) navigator.clipboard.writeText('');
      return false;
    }
  });
  function hide() { box0.style.filter = 'blur(28px)'; }
  function show() { box0.style.filter = ''; }
  document.addEventListener('visibilitychange', function () { document.hidden ? hide() : show(); });
  window.addEventListener('blur', hide);
  window.addEventListener('focus', show);
})();
</script>
<script>
(function () {
  var bar = document.getElementById('react'), card = bar.parentNode;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pick(e) {
    var b = e.target.closest('button'); if (!b) return;
    var was = b.classList.contains('on');
    var all = bar.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
    if (was) return;                       // bấm lần nữa để bỏ chọn
    b.classList.add('on');
    if (reduce) return;
    var cr = card.getBoundingClientRect(), br = b.getBoundingClientRect();
    for (var n = 0; n < 3; n++) {
      var s = document.createElement('span');
      s.className = 'float-emo'; s.textContent = b.dataset.e;
      s.style.left = (br.left - cr.left + br.width / 2 - 10 + (Math.random() * 16 - 8)) + 'px';
      s.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
      s.style.animationDelay = (n * 0.07) + 's';
      card.appendChild(s);
      setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(s), 1300);
    }
  }
  // 🫪 là nút ẩn: chạm nhanh = thả cảm xúc như thường, giữ 3 giây = mở ô nhập mã ảnh
  var secret = document.getElementById('infoBtn'), holdT = null, held = false;
  function endHold(e) {
    if (holdT === null) return;
    clearTimeout(holdT); holdT = null;
    if (held || e.type !== 'pointerup') return;
    if (document.querySelector('.tv-card').classList.contains('infoOpen')) document.dispatchEvent(new Event('kaiis:info'));   // đang mở -> chạm để đóng
    else pick({ target: secret });
  }
  secret.addEventListener('pointerup', endHold);
  secret.addEventListener('pointercancel', endHold);
  bar.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return; e.preventDefault();
    if (e.target.closest('button') === secret) {
      held = false; clearTimeout(holdT);
      try { secret.setPointerCapture(e.pointerId); } catch (x) {}
      holdT = setTimeout(function () {
        held = true;
        if (navigator.vibrate) navigator.vibrate(15);
        document.dispatchEvent(new Event('kaiis:info'));
      }, 3000);
      return;
    }
    pick(e);   // phản hồi ngay lúc chạm
  });
  bar.addEventListener('click', function (e) { if (e.detail === 0) pick(e); });                                       // bàn phím (Enter/Space)
})();
</script>
